version: '3.8'

# =====================================================
# Docker Compose del Backend (sin Kafka)
# Kafka ahora vive en un equipo separado (ver kafka-server/)
# =====================================================

services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - KAFKA_BROKER=${KAFKA_BROKER:-localhost:9092}
      - KAFKA_CLIENT_ID=${KAFKA_CLIENT_ID:-gestor-talleres-api}
    env_file:
      - .env